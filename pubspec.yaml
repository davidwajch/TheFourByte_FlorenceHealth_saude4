name: saude4
description: "Florence Health - App de pré-triagem e acesso facilitado a serviços de saúde"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  heart_bpm: ^2.0.0+0
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  http: ^1.2.1
  flutter_map: ^7.0.1
  latlong2: ^0.9.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/
  uses-material-design: true
